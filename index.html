<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Presente Distante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #050a14;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        .scene img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche perfeitamente a tela mantendo proporção */
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- CENA 1 -->
        <div id="scene-1" class="scene active" onclick="nextScene(2)">
            <img src="lotus01.jpg" alt="Envelope Fechado">
        </div>

        <!-- CENA 2 -->
        <div id="scene-2" class="scene" onclick="nextScene(3)">
            <img src="lotus02.jpg" alt="Carta Revelada">
        </div>

        <!-- CENA 3 -->
        <div id="scene-3" class="scene">
            <img src="lotus03.jpg" alt="Flor de Lótus">
        </div>
    </div>

    <script>
        function nextScene(sceneNumber) {
            const currentActive = document.querySelector('.scene.active');
            if (currentActive) {
                currentActive.classList.remove('active');
            }
            const next = document.getElementById('scene-' + sceneNumber);
            if (next) {
                next.classList.add('active');
            }
        }
    </script>
</body>
</html>
